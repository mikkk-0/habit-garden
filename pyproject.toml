[project]
name = "habit-garden"
version = "0.1.0"
description = "Локальный трекер ежедневных привычек"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7,<7"]

[project.scripts]
habit-garden = "habit_garden.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
habit_garden = ["static/*"]
